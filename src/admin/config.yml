backend:
  name: github
  # IMPORTANT: replace with your repo, e.g. "parkrakovski/parkrakovski"
  repo: YOUR_GITHUB_USER_OR_ORG/YOUR_REPO
  branch: main
  # IMPORTANT: set up an OAuth provider and put its URL here (see local_docs/admin.md rewrite we can do next)
  base_url: https://YOUR-OAUTH-PROVIDER.example
  auth_endpoint: auth

publish_mode: simple

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: content
    label: Content
    files:
      - name: services
        label: Services
        file: "src/_data/services.json"
        format: "json"
        fields:
          - name: items
            label: Services
            widget: list
            summary: "{{fields.title}} ({{fields.slug}})"
            fields:
              - { name: slug, label: Slug, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: body, label: Body, widget: text }

      - name: site
        label: Site Settings
        file: "src/_data/site.config.json"
        format: "json"
        fields:
          - name: brand
            label: Brand
            widget: object
            fields:
              - { name: name, label: Name, widget: string }
              - { name: language, label: Language, widget: string, default: "en" }
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: siteUrl, label: Site URL, widget: string }
              - { name: defaultTitle, label: Default title, widget: string }
              - { name: defaultDescription, label: Default description, widget: text }

